name: Extract Boat Race Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extractor
        run: python -m pip install libarchive-c
      - name: Download and extract
        run: |
          python daily.py
          python extract_lzh.py
      - name: Save extracted data
        uses: actions/upload-artifact@v4
        with:
          name: extracted-boat-data
          path: |
            data/
            results/
          retention-days: 90
